<body>

    <h1>🔐 Phishing Website Detection</h1>

    <p>Enter a website URL to check its basic risk classification.</p>

    <form action="/predict" method="POST">

        <input
            type="text"
            name="url"
            placeholder="https://example.com"
            required
        >

        <button type="submit">
            Check Website
        </button>

    </form>

    <br>

    <p>

        It cannot guarantee that a website is safe.
